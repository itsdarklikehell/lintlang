name: 🎥 Gource Visualization

on:
  push:
    branches: [main]
    paths-ignore:
      - 'gource/**'
      - '**.gif'
      - '**.mp4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gource-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gource:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Generate Gource video
        uses: nbprojekt/gource-action@v1
        with:
          gource_title: lintlang — deterministic analysis for AI agent instructions
          logo_url: https://raw.githubusercontent.com/itsdarklikehell/lintlang/main/assets/lintlang-header.jpg
          gource_resolution: 1080p
          gource_fps: 30
          gource_font_size: 28
          gource_seconds_per_day: '1'
          gource_start_date: '2024-01-01'
          avatars_auto_fetch: true

      - name: Generate GIF thumbnail
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -y \
            -i ./gource/gource.mp4 \
            -filter_complex "[0:v]select='not(mod(n,45))',setpts=0.1*PTS,fps=10,scale=480:-1:flags=lanczos" \
            -fps_mode vfr \
            ./gource/gource.gif

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: gource-video
          path: ./gource/gource.mp4
          retention-days: 90

      - name: Upload GIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: gource-gif
          path: ./gource/gource.gif
          retention-days: 90

      - name: Commit GIF to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          git add gource/gource.gif
          git diff --cached --quiet && echo "No GIF changes" || git commit -m "🎥 Update Gource visualization [skip ci]"
          git push origin main 2>&1 || echo "Push failed (may need manual trigger on first run)"
