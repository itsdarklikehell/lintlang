name: Hermes quality rail

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install project and declared gate tools
        run: python3 -m pip install -e '.[dev]'
      - name: Run declared full gate
        run: python3 .hermes/hermes_gate_runner.py full
